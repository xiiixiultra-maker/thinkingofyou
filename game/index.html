<script>

(() => {

const QPIN = (() => { const v = parseFloat(Q.get('q')); return v >= 0.3 && v <= 1 ? v : 0; })();
const UA = navigator.userAgent || '';
const CHROMIUM = /Chrome\/\d+/.test(UA) && !/iPad|iPhone|iPod/.test(UA);
const ADAPT = !QPIN && (CHROMIUM || Q.has('adapt'));
const DBG = Q.has('dbg') || !!window.LTWH_DBG;
const BUILD = '12c';
const RQ = { steps: [1, 0.85, 0.72, 0.6], i: 0, state: ADAPT ? 'watch' : 'done', n: 0, ms: 0, slow: 0, wait: 0, last: 0, mode: '', base: 0, best: 0, from: 0, log: [] };

const renderScale = () => QPIN || RQ.steps[RQ.i];
function resize() {

}
addEventListener('resize', () => { resize(); RQ.wait = performance.now() + 1000; }); resize();
const cssUnit = () => S * innerWidth / cv.width;
function rqSet(i, why) {

  resize(); RQ.n = 0; RQ.ms = 0; RQ.wait = performance.now() + 900;

}
const RQ_PLAY = { run: 1, intro: 1, pick: 1, cine: 1, tutorial: 1 };
function watchFrameRate() {
  const pn = performance.now(), d = pn - (RQ.last || pn); RQ.last = pn;
  if (RQ.state === 'done') return;

  if (G.mode !== RQ.mode) { RQ.mode = G.mode; RQ.wait = Math.max(RQ.wait, pn + 1200); }
  if (!RQ_PLAY[G.mode] || pausedAt !== null || document.hidden || pn < RQ.wait || d > 250) { RQ.n = 0; RQ.ms = 0; return; }
  RQ.n++; RQ.ms += d;
  if (RQ.ms < 2000) return;

  RQ.n = 0; RQ.ms = 0;

let G = null;

const OFF = (Q.get('no') || '').split(',');

const BEAT_MODE = Q.get('beat') === 'ring' ? 'ring' : Q.get('beat') === 'top' ? 'top' : 'bottom';
const MOD = { runner: false, scene: false, props: false, pick: false, cine: false, music: false, create: false };
const WARM = [], WARM_CAP = 9000;
let STARTING = 0;
const warmK = () => { let k = 0; for (const w of WARM) k += w.in ? 1 : w.part ? clamp(w.part(), 0, 1) : 0; return WARM.length ? k / WARM.length : 1; };
for (const [k, name] of [['runner', 'Runner'], ['scene', 'Scene'], ['props', 'Props'], ['pick', 'Pick'], ['cine', 'Cine'], ['create', 'Create']]) {
  const m = window[name];
  if (m && m.ready && typeof m.ready.then === 'function' && !Q.has('noart') && !OFF.includes(k)) {

}

function warmFor(p, part) {

}

const LOOK_KEY = 'ltwh-look';
let savedLook = null; try { savedLook = localStorage.getItem(LOOK_KEY); } catch (e) {}
let lookReady = Promise.resolve();
const looksOn = () => MOD.runner && !!Runner.features && !!Runner.features.looks && typeof Runner.setLook === 'function';
const createOn = () => MOD.create && looksOn() && !BOT;
const creatorOpen = () => MOD.create && typeof Create.isOpen === 'function' && !!Create.isOpen();
function setLook(look) {

  lookReady = Promise.resolve(Runner.setLook(look)).catch(e => console.warn('Runner.setLook', e));
  return lookReady;
}
function lookFrom(code) {

  try { return code === 'random' ? Runner.randomLook() : Runner.parseLook(code); } catch (e) { console.warn(e); return null; }
}
if (window.Runner && Runner.ready && typeof Runner.ready.then === 'function')
  Runner.ready.then(() => setLook(lookFrom(Q.get('look') || savedLook)), () => {});
function openCreator(then) {
  if (!createOn()) { if (then) then(); return; }
  try {
    Create.open({
      look: Runner.look,

      onDone: look => {
        setLook(look);
        try { savedLook = Runner.lookCode(look); localStorage.setItem(LOOK_KEY, savedLook); } catch (e) {}
        if (then) then();
      },
      onCancel: () => {},
    });
  } catch (e) { console.warn('Create.open', e); if (then) then(); }
}
const wantsCreator = () => createOn() && (Q.has('create') || (!savedLook && !Q.get('look')));
const WORDMARK = new Image(); WORDMARK.src = 'brand/wordmark.png';
let best = 0; if (!TABLET) try { best = Number(localStorage.getItem('ltwh-best')) || 0; } catch (e) {}

function fresh() {
  return { mode: 'title', act: 0, modeT: 0, cine: null, cineDur: 0, card: null,
    beats: [], nextBeatT: 0, beatN: 0, runStart: 0, judgeFrom: Infinity,
    dist: 0, pace: 0.35, speed: 0, h: 0, vy: 0, air: false, stumble: 0, lastT: 0,
    s1: 0, s2: 0, s3: 0, combo: 0, bestCombo: 0, perfects: 0, goods: 0, misses: 0, hits: 0, mangoes: 0,
    bag: [], delivered: 0, dropped: 0, drops: [], pick: null, pickPerfects: 0, shopX: null, thoughtT: 0,
    items: [], genTo: 600, rng: mulberry32(SEED), porchI: 0, fx: [], judge: null, endedAt: 0, newBest: false, anchors: null,
    tut: null, pickHintShown: false, newPlayer: false };
}
G = fresh();
const total = () => G.s1 + G.s2 + G.s3;
const mult = () => 1 + Math.min(1.5, Math.floor(G.combo / 8) * 0.5);
const running = () => G.mode === 'run' || G.mode === 'intro';

function sectionNow() { return G.mode === 'pick' ? 'pick' : running() ? (G.act === 3 ? 'home' : 'run') : 'cine'; }
function ivAt(bt) {
  if (running()) {
    const r = G.act === 3 ? IV_HOME : IV_RUN, len = G.act === 3 ? ACT3 : ACT1;
    return bt < G.runStart ? r[0] : lerp(r[0], r[1], clamp((bt - G.runStart) / len, 0, 1));

}

function pickIv() { return (window.MusicFilm && MusicFilm.on && MusicFilm.pickIv) || IV_PICK; }

    const iv = ivAt(G.nextBeatT);
    G.beats.push({ t: G.nextBeatT, n: G.beatN++, iv, sec: sectionNow(), j: G.nextBeatT >= G.judgeFrom, judged: false, sched: false });

}

function rebeat(t) {
  G.beats = G.beats.filter(b => b.sched);
  const last = G.beats[G.beats.length - 1];
  G.nextBeatT = last ? Math.max(t + 0.05, last.t + last.iv) : t + 0.3;
  G.judgeFrom = Infinity;
}

function wakeAudio() {
  if (!AC || pausedAt !== null || AC.state === 'running' || AC.state === 'closed') return;
  try { const p = AC.resume(); if (p && typeof p.catch === 'function') p.catch(() => {}); } catch (e) {}
}
for (const ev of ['pointerup', 'touchend', 'click', 'keyup']) addEventListener(ev, wakeAudio, true);
let PRESSED = false, LIFTED = 0;
addEventListener('pointerdown', () => { PRESSED = true; }, true);
for (const ev of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) addEventListener(ev, () => { PRESSED = false; LIFTED = performance.now(); }, true);

const waitFor = (p, ms) => Promise.race([Promise.resolve(p).then(() => 1, () => 1), new Promise(r => setTimeout(() => r(0), ms))]);

const SI = { audio: '', art: '', light: '', at: 0 };

  if (STARTING) return;

  const newPlayer = !!(opts && opts.newPlayer);
  if (newPlayer) best = 0;
  const id = STARTING = performance.now();

    if (STARTING !== id) return;
    STARTING = 0;
    G = fresh(); G.newPlayer = newPlayer; pausedAt = null; useAC = !!AC && AC.state === 'running'; clockBase = rawNow();

const TUT_SPLIT = 0.55;
let tutSeen = false, pickHintSeen = false;
try { tutSeen = localStorage.getItem('ltwh-tut') === '1'; pickHintSeen = localStorage.getItem('ltwh-tut-pick') === '1'; } catch (e) {}
const wantsTutorial = () => Q.has('tut') || G.newPlayer || (!tutSeen && !BOT);

  txt(G.delivered + ' of ' + BAG_CAP + ' mangoes shared', cx, y, 13, 'rgba(255,246,229,0.85)', 'center', 700); y += 26;
  const sc = scoresOn() || (window.Scores && Scores.status().state === 'closed') ? Scores.status() : null;

  const closedNow = !!window.Scores && typeof Scores.closed === 'function' && Scores.closed();
  const board = closedNow || (sc && sc.state === 'closed') ? 'Board closed   ·   ' + G.misses + (G.misses === 1 ? ' miss' : ' misses')
    : !sc ? '' : sc.state === 'saved' ? (sc.held ? 'Saved, in review' : !sc.rank ? 'Saved to the board'
      : '#' + sc.rank + (sc.practice ? ' in practice' : ' on the board'))
    : sc.state === 'saving' ? (sc.retrying ? 'Board busy, still saving…' : 'Saving to the board…')
    : sc.state === 'error' ? 'Not saved to the board' : '';
  txt((G.newBest ? 'New best!' : 'Your best: ' + best) + (board ? '   ·   ' + board : ''), cx, y, 14, C.gold, 'center', 800, 1); y += 30;
  if (t - G.endedAt > 1.2) txt('TAP TO RUN AGAIN', cx, Math.min(y, top + ph - 14), 15, C.cream, 'center', 900, 4);
}
function drawFx(t) {
  G.fx = G.fx.filter(f => t - f.t < 0.9);
  for (const f of G.fx) { const a = 1 - (t - f.t) / 0.9; ctx.globalAlpha = a; txt(f.text, f.x, f.y - (1 - a) * 30, f.size, f.color, 'center', 900, 1); }
  ctx.globalAlpha = 1;
}

function strideState(t) {
  let ph = t * 3, iv = IV_RUN[0];
  if (running() && G.beats.length) {
    let prev = null, next = null;
    for (const b of G.beats) { if (b.t <= t) prev = b; else { next = b; break; } }
    if (prev && next) { iv = next.t - prev.t; ph = (prev.n + (t - prev.t) / iv) * Math.PI; }
  }
  return { ph, iv };
}
function worldProgress(t) {
  if (G.mode === 'title') return 0;
  if (G.act === 3) return lerp(0.6, 1, clamp((t - G.runStart) / ACT3, 0, 1));
  return lerp(0, 0.3, clamp((t - G.runStart) / ACT1, 0, 1));
}
function view(t) {
  const ripe = { verde: 0, erizo: 0, mangonada: 0, gold: 0 };
  for (const r of G.bag) ripe[r]++;
  return { W, VH, OY, S, t, bag: { count: G.bag.length, ripe }, score: { run: G.s1, pick: G.s2, home: G.s3, total: total() } };
}
function drawFallbackShop(sx) {
  ctx.fillStyle = '#EFE6D2'; ctx.fillRect(sx - 170, GROUND - 330, 340, 330);
  ctx.fillStyle = 'rgba(255,214,150,0.85)'; ctx.fillRect(sx - 140, GROUND - 220, 280, 200);
  ctx.fillStyle = C.ink; ctx.fillRect(sx - 170, GROUND - 330, 340, 56);
  txt('SHOE GALLERY', sx, GROUND - 292, 26, C.cream, 'center', 900, 3);
}
function drawThought(t, px) {
  const k = clamp((t - G.thoughtT) / 0.8, 0, 1), a = G.anchors;

  const x = (a ? a.headTop.x : px + 6) + 26, y = Math.max(a ? a.headTop.y - 12 : GROUND - G.h - 392, -OY + 134);
  if (MOD.props && typeof Props.drawThought === 'function') { Props.drawThought(ctx, x, y, k, t); return; }
  drawWordmark(x, y - 60 - Math.sin(t * 2) * 3, 170, k);
}
function drawWorld(t) {
  const sc = { dist: G.dist, W, OY, t, progress: worldProgress(t) };
  if (MOD.scene) Scene.drawBackground(ctx, sc); else { drawSky(); drawSkyline(); drawPalms(); drawGround(); }
  const px = W * 0.28;
  for (let i = Math.max(0, G.porchI - 1); i < G.porchI + 2; i++) {
    const sx = px + porchX(i) - G.dist;
    if (sx > -260 && sx < W + 260) MOD.scene ? Scene.drawPorch(ctx, sx, GROUND, sc) : drawPorch(sx);
  }
  if (G.shopX !== null) {
    const sx = px + G.shopX - G.dist;
    if (MOD.cine && typeof Cine.drawShopfront === 'function') Cine.drawShopfront(ctx, sx, GROUND, { t, progress: sc.progress });
    else drawFallbackShop(sx);
  }
  for (const it of G.items) if (it.k === 'tree') {
    const sx = px + it.x - G.dist;
    if (sx > -660 && sx < W + 260) MOD.scene ? Scene.drawTree(ctx, sx, GROUND, sc) : drawTree(sx);
  }
  const ring = BEAT_MODE === 'ring' && (G.mode === 'run' || G.mode === 'intro');
  if (ring) drawBeatRing(t, px);
  for (const it of G.items) {
    const sx = px + it.x - G.dist; if (sx < -100 || sx > W + 100) continue;
    if (it.k === 'mango') {
      if (it.got) {
        if (MOD.props) { const k = (t - it.gotT) / 0.4; if (k < 1) Props.drawPickup(ctx, sx, GROUND - it.h, it.ripe, k); }
        else { const k = (t - it.gotT) / 0.25; if (k < 1) drawMango(sx, GROUND - it.h - k * 40, it.ripe, 1 - k * 0.6); }
      } else if (MOD.props) Props.drawMango(ctx, sx, GROUND - it.h, it.ripe,
        { t, hanging: it.tree, scale: 1, seed: it.x, ground: it.h < 100 ? GROUND : undefined });
      else drawMango(sx, GROUND - it.h, it.ripe);
    } else if (it.k !== 'tree') MOD.props ? Props.drawObstacle(ctx, it.k, sx, GROUND, t, { hit: it.hit, hitT: it.hitT, seed: it.x }) : drawObstacle(it, sx);
  }
  if (MOD.runner) {
    const st = strideState(t), moving = running() && pausedAt === null;
    const a = Runner.draw(ctx, { x: px, ground: GROUND, h: G.h, phase: st.ph, pace: G.pace, speed: moving ? G.speed : 0,
      beatInterval: st.iv, air: G.air, vy: G.vy, stumble: G.stumble, t,
      carry: G.act === 3 && running() ? { fill: G.bag.length, ripes: G.bag, scale: 1.45 } : null });
    G.anchors = a && a.headTop ? a : null;
  } else { drawRunner(t); G.anchors = null; }
  G.drops = G.drops.filter(d => t - d.t < 0.8);
  for (const d of G.drops) {
    const k = (t - d.t) / 0.8; if (k < 0) continue;
    const sx = px + d.wx - G.dist;
    if (MOD.props && typeof Props.drawMangoDrop === 'function') Props.drawMangoDrop(ctx, sx, d.y, d.ripe, k);
    else drawMango(sx - k * 60, Math.min(GROUND - 12, d.y + k * k * 220), d.ripe, 1);
  }
  if (G.act === 3 && running()) drawThought(t, px);
  if (MOD.scene && Scene.drawForeground) Scene.drawForeground(ctx, sc);
  if (ring) drawJudgeText(t, px);
  drawFx(t);
}
function draw(t) {
  changeBtn = null;
  ctx.setTransform(S, 0, 0, S, 0, OY * S);
  if (G.mode === 'pick' && G.pick) {
    ctx.save(); try { G.pick.draw(ctx, view(t)); } catch (e) { console.warn('Pick draw', e); G.pick = null; } ctx.restore();
    ctx.setTransform(S, 0, 0, S, 0, OY * S); drawCardOverlay(t);
    ctx.setTransform(S, 0, 0, S, 0, 0); drawPickHint(t);
  } else if ((G.mode === 'cine' || G.mode === 'end') && MOD.cine) {
    const name = G.mode === 'end' ? 'home' : G.cine, ct = G.mode === 'end' ? G.cineDur + (t - G.endedAt) : t - G.modeT;
    ctx.save(); try { Cine.draw(ctx, name, ct, view(t)); } catch (e) { console.warn('Cine draw', e); MOD.cine = false; } ctx.restore();
    if (G.mode === 'end') drawEnd(t);
  } else {
    drawWorld(t);
    if (G.mode === 'title') drawTitle(t);
    else if (G.mode === 'end') drawEnd(t);
    else if (G.mode === 'tutorial') { ctx.setTransform(S, 0, 0, S, 0, 0); drawTutorial(t); }
    else if (G.mode === 'cine' || G.mode === 'pick') drawFallbackCard(t);
    else {
      ctx.setTransform(S, 0, 0, S, 0, 0);
      if (BEAT_MODE !== 'ring') drawBeatTrack(t);
      drawHUD(t);
      ctx.setTransform(S, 0, 0, S, 0, OY * S); drawCardOverlay(t);
      if (G.mode === 'intro') { ctx.setTransform(S, 0, 0, S, 0, 0); drawIntro(t); }
    }
  }
  if (pausedAt !== null) { overlay(0.5); txt('PAUSED', W / 2, 220, 34, C.cream, 'center', 900, 4); txt('Tap to keep going', W / 2, 256, 15, 'rgba(255,246,229,0.8)', 'center', 700); }
}

function frame() {

  if (creatorOpen()) { G.lastT = 0; RQ.last = 0; RQ.wait = performance.now() + 1500; requestAnimationFrame(frame); return; }
  const t = now();
  const dt = clamp(t - (G.lastT || t), 0, 0.05); G.lastT = t;
  watchFrameRate();

  window.LTWH_BUSY = pausedAt === null && (G.mode === 'run' || G.mode === 'intro' || G.mode === 'pick' || G.mode === 'tutorial');
  if (pausedAt === null) update(t, dt);
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (BOT) { addEventListener('load', () => setTimeout(start, 300)); }
window.__ltwh = { get state() { return G; }, get mods() { return MOD; }, get changeBtn() { return changeBtn; }, get rq() { return RQ; },
  get starting() { return STARTING ? Math.round(performance.now() - STARTING) : 0; }, get audio() { return AC ? AC.state : 'off'; },
  get startInfo() { return SI; }, get usesAudioClock() { return useAC; }, get stamps() { return STAMPS.size; }, build: BUILD, chromium: CHROMIUM,
  start, step, jump, nextChapter: () => nextChapter(now()) };
})();
