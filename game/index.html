:root{--ink:#15130F;--cream:#FFF6E5;--mango:#F28C28;--violet:#2E2A4F;--gold:#F5D061}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;color:var(--cream);
 font:400 16px/1.45 "Apfel Grotezk",system-ui,-apple-system,sans-serif;
 background:radial-gradient(120% 75% at 72% 108%,#F7B06A 0%,#D9707A 24%,#7A4472 48%,#3A2F5C 70%,var(--violet) 88%) fixed,var(--violet)}
.card{width:min(420px,100%);background:rgba(21,19,15,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 border:1px solid rgba(255,246,229,.16);border-radius:24px;padding:28px 24px 20px;box-shadow:0 24px 70px rgba(10,6,20,.45)}
.kick{margin:0 0 8px;font-weight:500;font-size:14px;color:var(--gold)}
h1{margin:0 0 12px;font:700 42px/1.02 "Basteleur",Georgia,serif}
p{margin:0 0 18px;color:rgba(255,246,229,.86)}
input[type=password]{width:100%;font:500 18px "Apfel Grotezk",system-ui,sans-serif;padding:14px 16px;border-radius:14px;
 border:1.5px solid rgba(255,246,229,.32);background:rgba(255,246,229,.07);color:var(--cream);outline:none}
input[type=password]::placeholder{color:rgba(255,246,229,.5)}
input[type=password]:focus{border-color:var(--mango);background:rgba(255,246,229,.11)}
button{margin-top:12px;width:100%;min-height:52px;font:700 22px "Basteleur",Georgia,serif;padding:12px;border-radius:14px;
 border:0;background:var(--mango);color:var(--ink);cursor:pointer;box-shadow:0 8px 24px rgba(242,140,40,.35)}
button:disabled{opacity:.75;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
label{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px;color:rgba(255,246,229,.8);cursor:pointer}
label input{width:18px;height:18px;accent-color:var(--mango)}
.bar{height:4px;border-radius:2px;background:rgba(255,246,229,.15);margin-top:14px;overflow:hidden;visibility:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mango);transition:width .15s}
.err{min-height:20px;margin-top:10px;font-size:14px;color:#FF9A86}
.foot{margin-top:4px;font-size:12px;color:rgba(255,246,229,.6)}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="kick">Shoe Gallery &middot; Preview</div>
  <h1>The Long Way Home</h1>
  <p>A first look at the release-day game. Enter the code to play.</p>
  <input type="password" id="pw" placeholder="Code" autocapitalize="off" autocorrect="off" spellcheck="false"
         inputmode="numeric" aria-label="Code">
  <button id="go" type="submit">Play</button>
  <label><input type="checkbox" id="rem" checked> Remember on this device</label>
  <div class="bar" id="bar" aria-hidden="true"><i id="fill"></i></div>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">For the team only. Please don&rsquo;t share it yet.</div>
</form>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const KEY = 'ltwh.gate', CACHE = 'ltwh-game';
  const at = p => new URL(p, location.href).href;
  const ok = window.isSecureContext && 'serviceWorker' in navigator && 'caches' in window && 'DecompressionStream' in window;
  const meta = fetch('bundle.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('bundle.json ' + r.status); return r.json(); });
  const sw = ok ? navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready) : null;
  const say = (t, bad) => { $('err').textContent = t || ''; $('err').style.color = bad === false ? 'rgba(255,246,229,.8)' : ''; };
  const busy = (on, label) => { $('go').disabled = on; $('go').textContent = label || 'Play'; $('bar').style.visibility = on ? 'visible' : 'hidden'; };
  const prog = k => { $('fill').style.width = Math.round(Math.max(0, Math.min(1, k)) * 100) + '%'; };
  async function cachedVersion() {
    try { const r = await (await caches.open(CACHE)).match(at('app/__v')); return r ? await r.text() : null; } catch (e) { return null; }
  }
  async function download(url, size) {
    const r = await fetch(url, { cache: 'no-cache' });
    if (!r.ok) throw new Error(url + ' ' + r.status);
    if (!r.body || !r.body.getReader) return new Uint8Array(await r.arrayBuffer());
    const total = size || +r.headers.get('content-length') || 0, rd = r.body.getReader(), parts = [];
    let got = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; if (total) prog(0.1 + 0.75 * got / total); }
    const out = new Uint8Array(got); let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  }
  async function unlock(pass, remember, silent) {
    busy(true, 'Unlocking'); say(''); prog(0.04);
    try {
      const M = await meta;
      const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(M.salt), iterations: M.iter, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

      catch (e) { const x = new Error('pass'); x.pass = true; throw x; }
      if (remember) { try { localStorage.setItem(KEY, pass); } catch (e) {} }

      const ct = await download('bundle.bin?v=' + M.v, M.size);
      const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(M.iv) }, key, ct);
      prog(0.9);
      const pack = new Uint8Array(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
      const hl = new DataView(pack.buffer, pack.byteOffset).getUint32(0, true);
      const head = JSON.parse(new TextDecoder().decode(pack.subarray(4, 4 + hl))), base = 4 + hl;
      await caches.delete(CACHE);
      const c = await caches.open(CACHE);
      await Promise.all(head.files.map(([p, off, len, type]) =>
        c.put(at('app/' + p), new Response(pack.slice(base + off, base + off + len), { headers: { 'Content-Type': type } }))));
      await c.put(at('app/__v'), new Response(head.v, { headers: { 'Content-Type': 'text/plain' } }));

      await sw;

    } catch (e) {
      busy(false); prog(0);
      if (e && e.pass) {
        try { localStorage.removeItem(KEY); } catch (x) {}
        if (!silent) { say('That code didn’t work.'); const f = $('f'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); $('pw').select(); }
      } else { say('Something went wrong loading the game. Check your connection and try again.'); console.warn(e); }
    }
  }
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    if (!ok) return;
    const v = $('pw').value.trim().toLowerCase();
    if (v) unlock(v, $('rem').checked, false);
  });
  (async () => {
    if (!ok) { busy(true, 'Play'); say('This preview needs a regular Chrome or Safari window (private windows can’t open it).'); return; }
    try {
      const [M, v] = await Promise.all([meta, cachedVersion()]);
      if (v && v === M.v) { busy(true, 'Opening'); await sw; location.replace('app/'); return; }   // already unlocked here
    } catch (e) { /* fall through to the form */ }

})();
